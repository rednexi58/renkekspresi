# Unity iOS upload workflow. Build/sign the IPA in Unity Build Automation first.
# This replaces the active Godot workflow; the previous YAML is archived under ci/legacy_godot.yaml.
workflows:
  renk-ekspresi-unity-testflight:
    name: Renk Ekspresi - Unity TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple AppStore
    environment:
      xcode: latest
      groups:
        - renk_ekspresi_ios
    scripts:
      - name: Download and verify Unity iOS IPA
        script: |
          set -euo pipefail
          : "${UNITY_IOS_IPA_URL:?Set UNITY_IOS_IPA_URL to the download link of a signed Unity iOS IPA.}"
          mkdir -p build/ios/ipa
          curl --fail --location --retry 2 --silent --show-error \
            --output build/ios/ipa/RenkEkspresiUnity.ipa "$UNITY_IOS_IPA_URL"
          python3 ci/verify_unity_ipa.py build/ios/ipa/RenkEkspresiUnity.ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload to App Store Connect/TestFlight. Internal testers can use the
        # processed build; external beta review requires complete test info.
        submit_to_testflight: false
        submit_to_app_store: false
