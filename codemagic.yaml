workflows:
  renk-ekspresi-unity-testflight:
    name: Renk Ekspresi - Unity TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple AppStore
    environment:
      xcode: latest
      groups:
        - renk_ekspresi_ios
    scripts:
      - name: Download and verify Unity iOS IPA
        script: |
          set -euo pipefail
          mkdir -p build/ios/ipa
          python3 - <<'PY'
          import json
          import shutil
          import urllib.request
          from pathlib import Path

          share_id = "x1eT8Jz72cyGueUKDw-1Hav4CH1xo6W7PDsbow1O4nw"
          api_url = f"https://build-automation.services.api.unity.com/v2/shares/{share_id}"

          with urllib.request.urlopen(api_url, timeout=30) as response:
              build = json.load(response)

          if build.get("buildStatus") != "success":
              raise SystemExit("Unity build is not successful")
          if build.get("projectVersion", {}).get("bundleId") != "com.bedogames.renkekspresi":
              raise SystemExit("Unity IPA has the wrong bundle ID")

          artifact = build["links"]["download_primary"]
          if artifact.get("meta", {}).get("type") != "IPA":
              raise SystemExit("Unity primary artifact is not an IPA")

          output = Path("build/ios/ipa/RenkEkspresiUnity.ipa")
          with urllib.request.urlopen(artifact["href"], timeout=180) as source:
              with output.open("wb") as destination:
                  shutil.copyfileobj(source, destination)

          if output.stat().st_size < 100_000:
              raise SystemExit("Downloaded IPA is unexpectedly small")
          print(f"Downloaded Unity build #{build['build']} ({output.stat().st_size} bytes)")
          PY
          python3 ci/verify_unity_ipa.py build/ios/ipa/RenkEkspresiUnity.ipa
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
