# Native Godot playtest. Requires Apple signing setup. Not a verified IPA.
workflows:
  renk-ekspresi-ios-playtest:
    name: Renk Ekspresi - iOS playtest
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Apple AppStore
    environment:
      xcode: latest
      groups:
        - renk_ekspresi_ios
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.bedogames.renkekspresi
    scripts:
      - name: Validate build settings
        script: python3 ci/prepare_ios.py
      - name: Install Godot and iOS export template
        script: bash ci/install_godot_macos.sh
      - name: Import and validate the project
        script: |
          set -euo pipefail
          .ci-tools/Godot.app/Contents/MacOS/Godot --headless --path Godot --editor --import --quit
          .ci-tools/Godot.app/Contents/MacOS/Godot --headless --path Godot --script res://tests/test_slots_scores_v027.gd
      - name: Export native Xcode project
        script: |
          set -euo pipefail
          mkdir -p build/ios
          .ci-tools/Godot.app/Contents/MacOS/Godot --headless --path Godot --export-release iOS ../build/ios/RenkEkspresi.xcodeproj
          test -d build/ios/RenkEkspresi.xcodeproj
      - name: Apply provisioning profiles
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --project build/ios/RenkEkspresi.xcodeproj --scheme RenkEkspresi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
